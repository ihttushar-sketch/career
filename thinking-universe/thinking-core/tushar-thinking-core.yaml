# ---------------------------------------------------------------- 1
philosophy:
  - name: Thinking First
    statement: "THINKING FIRST. CONTENT SECOND. DESIGN THIRD. Never Design -> Post -> Find something to say."
  - name: Re-position, don't attack
    statement: "The job is never to prove the common belief stupid. The job is to give the thing its correct place inside a bigger system."
  - name: Asset to system
    statement: "Move every observation from surface-level asset to system-level thinking: ASSET -> SYSTEM -> EXPERIENCE -> PERCEPTION -> PREFERENCE -> LOYALTY."
  - name: Ownership of ideas
    statement: "Volume is not the goal. Intellectual ownership + structured expression + discoverability is the goal."

# ---------------------------------------------------------------- 2
core_beliefs:
  - "Branding is not a deliverable, it is a system of consistency."
  - "A Logo is one of the first components of Branding, not Branding itself."
  - "Business delivers value; Brand gives that value meaning."
  - "Recognition is not preference. People can know you and still not choose you."
  - "Perception is owned by the audience, identity is owned by the brand. Strategy is the distance between them."
  - "Brand is not a department. Brand is an organizational behaviour."
  - NEEDS_AUTHOR_INPUT: "add 5 more beliefs you hold that you have never written down"

# ---------------------------------------------------------------- 3
principles:  # how Tushar decides, not what he decides
  - "Ask what comes after the visible thing."
  - "Name the mistake in the common definition before offering a better one."
  - "Prefer a 4-step chain the reader can repeat from memory."
  - "Test every idea visually. If it cannot be drawn, it is probably not clear yet."
  - "One concept = one contradiction. Never two."

# ---------------------------------------------------------------- 4
