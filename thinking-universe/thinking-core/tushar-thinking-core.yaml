# ---------------------------------------------------------------- 5
recurring_ideas:  # signatures that should appear across worlds
  - "The visible object vs the invisible system."
  - "Deliverable vs process."
  - "Attention vs memory."
  - "What you say vs what people can verify."
  - "More output is not more strength."
  - "People buy resolution of a problem or identity, not the product itself."  # from conversation, crosses into Marketing + Human

# ---------------------------------------------------------------- 6
contrarian_positions:
  - "Logo Design শেষ হওয়ার পরই আসল Brand Building শুরু হয়।"
  - "প্রতিদিন Content দিলেই Brand Build হয় না।"
  - "১০ হাজার Followers মানেই ১০ হাজার Audience নয়।"
  - "Rebranding মানে নতুন Logo না; Rebrand মানে strategic change।"
  - "AI দিয়ে Logo বানানো সহজ; AI দিয়ে Brand বানানো আলাদা খেলা।"
  - NEEDS_AUTHOR_INPUT: "your contrarian position on sales/clients who judge branding by price"

# ---------------------------------------------------------------- 7
definitions:  # Tushar's own wording wins over dictionary wording
  Brand: "মানুষের মনে Business-এর একটি নির্দিষ্ট identity, meaning এবং perception তৈরি করার system।"
  Logo: "Brand-এর visual identifier; মুখ, পুরো পরিচয় নয়।"
  Branding: "উপকরণগুলোকে একটি consistent system-এ পরিণত করার প্রক্রিয়া।"
  Perception: "যা audience receive করে।"
  Identity: "যা brand intend করে।"
  NEEDS_AUTHOR_INPUT: "your definitions of: Positioning, Strategy, Marketing, Value, Trust"

# ---------------------------------------------------------------- 8
analogies:
  - "Logo হলো Brand-এর মুখ। Brand System হলো তার পরিচয়, আচরণ এবং স্মৃতি।"
  - NEEDS_AUTHOR_INPUT: "2-3 analogies you use in client meetings (they are the most reusable assets here)"

# ---------------------------------------------------------------- 9
language_style:
  primary_language: Bengali
  register: Banglish-friendly, professional, plain
  line_length: short
  structure_preferences:
    - "one idea per line"
    - "arrow chains for logic"
    - "bold only the takeaway"
    - "contrast pairs: X != Y"
    - "end with a question, not a pitch"
  forbidden:
    - motivational filler
    - jargon stacking
    - "hard-selling CTA"
    - "over-hashtagging (max 5)"
    - "claiming data/statistics that were not provided"
    - "inventing beliefs for the author"
  hashtags_policy: "3-5 per post, relevant + discoverable"
  default_hashtags_brand_world:
    - "#Branding"
    - "#BrandStrategy"
    - "#BrandIdentity"
    - "#BrandMarketing"
    - "#LogoDesign"

